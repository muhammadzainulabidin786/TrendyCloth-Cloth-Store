<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Wishlist — Solstice</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/wishlist.css" />
</head>
<body data-page="wishlist">

  <div id="header-placeholder"></div>

  <main class="container wishlist-page">
    <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span>Wishlist</nav>
    <h1>Your Wishlist</h1>
    <p class="lede">Saved pieces, ready whenever you are.</p>

    <div class="product-grid" id="wishlistGrid"></div>

    <div class="empty-state" id="wishlistEmpty" style="display:none">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M12 20.4c-.3 0-.6-.1-.8-.3C7 16.7 3.5 13.6 3.5 9.8 3.5 7.1 5.6 5 8.3 5c1.5 0 2.9.7 3.7 1.9C12.8 5.7 14.2 5 15.7 5c2.7 0 4.8 2.1 4.8 4.8 0 3.8-3.5 6.9-7.7 10.3-.2.2-.5.3-.8.3z"/>
      </svg>
      <h2>Your wishlist is empty</h2>
      <p>Tap the heart on any product to save it here.</p>
      <a href="catalog.html" class="btn btn-primary" style="margin-top:1.5rem;">Browse products</a>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/products.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
