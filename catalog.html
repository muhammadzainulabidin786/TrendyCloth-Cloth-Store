<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop All — TrendyCloth</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/catalog.css" />
</head>
<body data-page="catalog">

  <div id="header-placeholder"></div>

  <main class="container">
    <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span>Shop All</nav>

    <div class="catalog__heading">
      <h1>Shop All</h1>
      <p>Everyday clothing, cut to last. Filter by category to find your size faster.</p>
    </div>

    <div class="catalog">
      <aside class="filters">
        <h4>Category</h4>
        <div class="filter-group" id="categoryFilters"></div>

        <h4>Type</h4>
        <div class="filter-group" id="subcategoryFilters"></div>

        <button class="btn-ghost" id="clearFilters">Clear all filters</button>
      </aside>

      <div>
        <div class="catalog__toolbar">
          <span class="catalog__count" id="catalogCount">0 items</span>
          <div class="catalog__sort">
            <label for="sortSelect" class="visually-hidden">Sort by</label>
            <select id="sortSelect">
              <option value="featured">Sort: Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
            </select>
          </div>
        </div>

        <div class="product-grid" id="catalogGrid"></div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/products.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
